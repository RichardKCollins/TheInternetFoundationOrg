    function renderPosts(items) {
      const list = document.getElementById('postsList');
      const count = document.getElementById('resultsCount');
      count.textContent = `Showing ${items.length} of ${posts.length} posts`;
      list.innerHTML = items.map(p => `
        <li class="py-3 flex justify-between items-baseline hover:bg-gray-50 px-2 rounded">
          <a href="${p.url}" class="text-blue-700 hover:underline font-medium text-base">${p.title}</a>
          <span class="text-xs text-gray-400 font-mono ml-4 shrink-0">${p.date}</span>
        </li>
      `).join('');
    }

    function filterPosts() {
      const q = document.getElementById('searchBox').value.toLowerCase();
      const filtered = posts.filter(p => p.title.toLowerCase().includes(q));
      renderPosts(filtered);
    }

    // Initial render
    renderPosts(posts);
  </script>
